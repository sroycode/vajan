# Vajan: Long-Duration Visual Scene Decomposer & Reimaginer (Up to 5 min)

# Pipeline Strategy: Direct Visual Decomposition (No Text Bottleneck)
pipeline:
  preserve_audio: true             # Retain and remux original audio synchronized 1:1
  target_fps: 24                   # High-production standard framerate (24 fps)
  
# Long-Form Video Chunking Strategy (Supports up to 5 mins / 7,200+ frames)
chunking:
  chunk_duration_sec: 4.0          # Process video in ~4 second sliding windows (96 frames @ 24fps)
  overlap_sec: 0.5                 # 0.5s temporal overlap for smooth cross-fading / seamless stitching
  enable_scene_cut_detection: true # Use PySceneDetect to avoid chunking across hard camera cuts
  threshold_detector: 27.0         # Scene cut sensitivity

# Visual Scene Decomposition (SAM 2 + Depth Anything)
decomposition:
  # Meta SAM 2 Model for long-video multi-object tracking
  sam2:
    model_id: "facebook/sam2-hiera-large"  # High-end GPU model (A100/H100/H200)
    device: "cuda"
    points_per_side: 32                    # Grid density for automatic mask generation
  
  # 3D Spatial Geometry & Camera Tracking
  depth:
    model_id: "depth-anything/Depth-Anything-V2-Large-hf"
    device: "cuda"

# Direct Visual Re-imagining Engine (Diffusion / Reskinning)
reimagining:
  # High-end Video DiT / ControlNet model
  model_id: "THUDM/CogVideoX-5B"
  precision: "bfloat16"                    # BF16 on modern Tensor Cores (A100/H100/H200)
  guidance_scale: 6.0
  num_inference_steps: 30
  
  # Visual Transformation Balance:
  # High denoise (0.70 - 0.80) reimagines textures and appearance
  # while SAM2 masks and Depth maps hold the physical actions locked in place.
  denoise_strength: 0.75

# Built-in Aesthetic Palettes (Direct visual styling modifiers)
styles:
  cinematic_film:
    style_prompt: "masterpiece 35mm cinematic film still, sharp crisp textures, Kodak Portra 400 color grading, atmospheric shadows, 8k resolution, award winning cinematography"
  
  gothic_victorian:
    style_prompt: "dark gothic oil painting masterpiece, ornate 19th century velvet fabrics, antique mahogany wood, dramatic Rembrandt candlelight, volumetric shadows"

  cyberpunk_neon:
    style_prompt: "gritty neo-Tokyo cyberpunk, volumetric neon rim lighting, iridescent metallic textures, rain-slicked reflective surfaces, Unreal Engine 5 cinematic render"

  high_fashion_editorial:
    style_prompt: "Vogue high-fashion editorial, clean minimalist architecture, tailored haute couture designer clothing, studio softbox lighting, pristine sharp focus"
